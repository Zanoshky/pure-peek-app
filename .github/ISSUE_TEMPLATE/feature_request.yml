name: Feature request
description: An idea for something Pure Peek could do, or a kind of file it could open.
title: "[idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What you want
      description: Describe the feature in a few lines.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What would it help you do? A real example helps.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: "Which screen or kind of file?"
      options:
        - home screen
        - opening a file (Open with, Share, pickers)
        - folder view
        - photo
        - PDF
        - CSV or Excel table
        - text, log or code
        - JSON
        - Markdown
        - Word document
        - web page or SVG
        - zip
        - audio or video
        - font
        - bytes view
        - find
        - About this file
        - share or open with
        - settings
        - widget
        - other
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Pictures or links
      description: A sketch, a screenshot or a link to something similar.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I searched the open issues and this idea is not there yet.
          required: true
